<!DOCTYPE>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Academic Planner 2.0</title>
        <link rel="stylesheet" href="./styles/styles.css">
    </head>

    <body>
        <div class="container">
            <nav>
                <h1>Academic Planner</h1>
            </nav>
            <aside>
                <div class="side-links">
                    <a href="index.html">Dashboard</a>
                    <a>Courses</a>
                    <a>Analytics</a>
                    <a>Settings</a>
                </div>
            </aside>
            <main>
                <div class="courses-grid">
                    <button id="add-course-btn" class="add-course">
                        +
                    </button>

                    <div id="modal-overlay" class="hidden">
                        <div class="modal">
                            <h2>Add Course</h2>

                            <form id="add-course-form">
                                <input id="course-input" type="text" placeholder="Course name">
                                <button id="close-modal">Add</button>
                            </form>

                            <!-- <input type="text" placeholder="Course name"> -->

                            <!-- <button id="close-modal">Add</button> -->
                        </div>
                    </div>
                </div>
                <div class="pomodoro">

                </div>
                <div class="calendar">

                </div>
                <div class="deadlines">

                </div>
            </main>
        </div>
        <script src="./scripts/app.js"></script>
    </body>
</html>
