<!DOCTYPE>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Academic Planner 2.0</title>
        <link rel="stylesheet" href="./styles/styles.css">
    </head>

    <body>
        <div class="container">
            <nav>
                <h1>Academic Planner</h1>
            </nav>
            <aside>
                <div class="side-links">
                    <a href="index.html">Dashboard</a>
                    <a>Analytics</a>
                    <a>Settings</a>
                </div>
            </aside>
            <main>
                <div class="courses-grid">
                    <!-- Dynamically Created Course Cards Go Here-->
                    <button id="add-course-btn" class="add-course">
                        +
                    </button>

                    <div id="modal-overlay" class="hidden">
                        <div class="modal">
                            <h2>Add Course</h2>

                            <form id="add-course-form">
                                <input id="course-input" type="text" placeholder="Course name">
                                <button id="close-modal" type="submit">Add</button>
                            </form>
                        </div>
                    </div>
                </div>
                <div class="pomodoro">
                    <h2>pomodoro timer</h2>
                    <div class="timer-display">
                        <span id="minutes">25</span>:<span id="seconds">00</span>
                    </div>
                    <div class="controls">
                        <button id="start-btn">
                            &#9658
                        </button>
                        <button id="pause-btn">
                            &#9208
                        </button>
                        <button id="stop-btn">
                            &#9632
                        </button>
                    </div>
                </div>
                <div class="calendar">

                </div>
                <div class="deadlines">

                </div>
            </main>
        </div>
        <script type="module" src="./scripts/app.js"></script>
    </body>
</html>
